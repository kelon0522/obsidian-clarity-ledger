name: Release

# tag push 时自动发版。
#
# **tag 必须严格等于 manifest.json 的 version，且不带 v 前缀** ——
# Obsidian 按 version 去找同名 tag 的 Release，带 v 就匹配不上，
# 用户装不到更新。npm version 会自动打上不带前缀的 tag。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  # 产物证明（attestation）必须的两种权限 —— 少任何一个，attest 步骤都会失败：
  # id-token 用来签发「本次构建的 OIDC 身份」，attestations 用来把证明写进仓库。
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与 ci.yml **保持一致** —— 两边版本不同就会出现
          # 「CI 绿的、Release 红的」，或者反过来，而两边都不会说明原因。
          # 为什么必须是 22：jsdom 30 要求 node ^22.22 || ^24.15 || >=26。
          node-version: 22

      - run: npm ci

      # **测试必须跑在发版之前。**
      # 构建成功 ≠ 逻辑对：这个项目的 200 条用例管的是拖拽落位、迁移不覆盖、
      # 编解码往返这些「错了但不会报错」的地方 —— 它们坏了用户看到的是
      # 「计划时间自己变了」，没有任何报错可查。
      # 发出去再想修，只能等下一个版本。
      - name: Test
        run: npm test

      - name: Typecheck + Build
        run: npm run build

      # 产物自检：真的 require 一遍 main.js、检查样式齐备。
      # 发版是最后一道闸，构建产物有问题绝不能传上去 ——
      # 用户装到坏版本只能等下一次发版才能修回来。
      - name: Verify build
        run: node scripts/verify-build.mjs

      # 产物证明（attestation）：证明「Release 附件确实由本仓库这次构建产出」。
      # 社区目录的评分卡会检查它 —— 缺了会被标「Missing GitHub artifact
      # attestations」，版本审核判 Failed（2026-10-16，0.1.8 就是这么挂的）。
      # 用户侧可用 `gh attestation verify main.js --repo <owner>/<repo>` 验证。
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # **必须是 false，不能是 draft。**
          # Obsidian 通过 GitHub API 按 version 找**已发布**的 Release 取附件；
          # draft 状态的 Release 对外不可见 → 用户「装了更新装不上」，
          # 而且社区列表里点进去也是404。
          # 想先看内容再发，就手动把 draft 勾掉 —— 别让流水线默认出 draft。
          draft: false
          prerelease: false
          # 自动生成发布说明 —— 评分卡有一条「release has no description」，
          # 空 body 会被点名（自动生成的内容至少含 Full Changelog 链接）。
          # 需要更详细的说明就发版后 `gh release edit <版本> --notes ...` 补。
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
          # 附件必须**逐个列出**。塞在 source.zip 里 Obsidian 读不到。
          # icon.png / screenshot.png 不在这里 —— 社区列表的图标取自
          # raw.githubusercontent 上的仓库根目录那份，跟 Release 附件无关。
